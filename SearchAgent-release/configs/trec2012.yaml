# SearchAgent — TREC Session Track 2012 Configuration
# Calibrated to real 2012 stats: ~2.78 clicks/session, abandon 0.265, reform 0.480.
# Medium-engagement dataset. Simulation dynamics frozen from per-dataset calibration.
# CFS weights intentionally identical to default.yaml (metric kept uniform across datasets).

llm:
  model_name: "deepseek-v4-flash"  # API-only; no local model
  temperature: 0.7
  max_new_tokens: 256
  top_p: 0.9

persona:
  age_range: [18, 65]
  search_expertise:
    - "novice"
    - "intermediate"
    - "expert"
  ad_sensitivity:
    - "ad_tolerant"
    - "ad_neutral"
    - "ad_averse"
  decision_style:
    - "impulsive"
    - "deliberate"
    - "price_sensitive"
  patience_level:
    - "low"
    - "medium"
    - "high"

environment:
  max_results_per_page: 10
  max_ads_per_page: 3
  ad_positions: [0, 3, 7]
  position_bias:
    # Matched to real 2012 click-position distribution (rank1~0.47, rank2~0.27)
    click_prob_by_rank: [0.47, 0.27, 0.14, 0.06, 0.03, 0.02, 0.015, 0.01, 0.008, 0.005]

simulation:
  max_session_steps: 20
  max_queries_per_session: 5
  session_timeout_prob: 0.06       # mild mid-session timeout
  pre_click_abandon_prob: 0.22     # real abandon 0.265: ~22% zero-click sessions
  num_sessions: 100
  seed: 42
  log_dir: "./logs"
  output_dir: "./output"

intent:
  states:
    - "exploratory"
    - "focused"
    - "transactional"
  initial_distribution: [0.6, 0.3, 0.1]
  transitions:
    click_organic: [0.2, 0.5, 0.3]
    click_ad: [0.1, 0.2, 0.7]
    skip: [0.5, 0.3, 0.2]
    next_page: [0.4, 0.4, 0.2]
    reformulate: [0.5, 0.4, 0.1]
    new_query: [0.7, 0.2, 0.1]
    abandon: [0.0, 0.0, 0.0]
    end_session: [0.0, 0.0, 0.0]

evaluation:
  metrics:
    - "click_position_jsd"
    - "clicks_per_session_gap"
  cfs_weights:
    click_position_jsd: 0.30
    clicks_per_session_gap: 0.70

device: "auto"

calibration:
  # TREC 2012: medium-engagement (2.78 clicks/session, abandon 0.265).
  # Balanced lambda_click/kl. Moderate hidden for small dataset (98 sessions).
  calibrator_path: "output/calib/calibrator.pt"
  hidden: 64
  exam_dim: 7
  attr_dim: 7
  lambda_click: 2.0    # tuned up: click_jsd=0.208 too high, need stronger click alignment
  lambda_kl: 0.08      # slight reduction to give calibrator more freedom
  lambda_cal: 0.08     # tuned up: abandon/reform both low, trust gate needs more signal
  lr: 0.003
  epochs: 400
  click_temperature: 3.4    # offline-tuned (sampling MC)
  target_clicks: 2.78    # soft cap = real clicks/session
