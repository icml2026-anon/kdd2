# SearchAgent — TREC Session Track 2014 Configuration
# Calibrated to real 2014 stats: ~1.34 clicks/session, abandon 0.490, reform 0.621.
# CFS weights intentionally identical to default.yaml (metric kept uniform across datasets).

llm:
  model_name: "deepseek-v4-flash"  # API-only; no local model
  temperature: 0.7
  max_new_tokens: 256
  top_p: 0.9

persona:
  age_range: [18, 65]
  search_expertise:
    - "novice"
    - "intermediate"
    - "expert"
  ad_sensitivity:
    - "ad_tolerant"
    - "ad_neutral"
    - "ad_averse"
  decision_style:
    - "impulsive"
    - "deliberate"
    - "price_sensitive"
  patience_level:
    - "low"
    - "medium"
    - "high"

environment:
  max_results_per_page: 10
  max_ads_per_page: 3
  ad_positions: [0, 3, 7]
  position_bias:
    # Matched to real 2014 click-position distribution (steep, rank1~0.62)
    click_prob_by_rank: [0.62, 0.23, 0.09, 0.04, 0.02, 0.007, 0.003, 0.001, 0.001, 0.001]

simulation:
  max_session_steps: 20
  max_queries_per_session: 5
  session_timeout_prob: 0.06       # low: let click sessions click more (sim clicks 0.40 vs real 1.34)
  pre_click_abandon_prob: 0.28     # real abandon 0.49; timeout adds the rest (v5 over-abandoned at 0.68)
  num_sessions: 100
  seed: 42
  log_dir: "./logs"
  output_dir: "./output"

intent:
  states:
    - "exploratory"
    - "focused"
    - "transactional"
  initial_distribution: [0.6, 0.3, 0.1]
  transitions:
    click_organic: [0.2, 0.5, 0.3]
    click_ad: [0.1, 0.2, 0.7]
    skip: [0.5, 0.3, 0.2]
    next_page: [0.4, 0.4, 0.2]
    reformulate: [0.5, 0.4, 0.1]
    new_query: [0.7, 0.2, 0.1]
    abandon: [0.0, 0.0, 0.0]
    end_session: [0.0, 0.0, 0.0]

evaluation:
  metrics:
    - "click_position_jsd"
    - "clicks_per_session_gap"
  cfs_weights:
    click_position_jsd: 0.30
    clicks_per_session_gap: 0.70

device: "auto"

calibration:
  # TREC 2014: low-engagement, high-abandon (1.34 clicks, abandon 0.490).
  # Strong KL (LLM semantic prior matters for short task-focused sessions).
  # Strong lambda_cal (trust gate must correctly downweight LLM when quality is poor).
  # Largest hidden: 1257 sessions, most training signal.
  calibrator_path: "output/calib/calibrator.pt"
  hidden: 96
  exam_dim: 7
  attr_dim: 7
  lambda_click: 1.5    # tuned UP: sim under-clicks badly (0.40 vs 1.34), need stronger click signal
  lambda_kl: 0.12      # moderate: don't over-constrain to prior
  lambda_cal: 0.10     # moderate trust-gate weight
  lr: 0.002            # slightly lower lr: larger dataset, more stable gradients
  epochs: 500          # more epochs: largest dataset benefits from longer training
  click_temperature: 3.0    # offline-tuned (sampling MC)
  target_clicks: 1.34    # soft cap = real clicks/session
