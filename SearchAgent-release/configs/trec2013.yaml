# SearchAgent — TREC Session Track 2013 Configuration
# Calibrated to real 2013 stats: ~4.41 clicks/session, abandon 0.038, reform 0.504.
# CFS weights intentionally identical to default.yaml (metric kept uniform across datasets).

llm:
  model_name: "deepseek-v4-flash"  # API-only; no local model
  temperature: 0.7
  max_new_tokens: 256
  top_p: 0.9

persona:
  age_range: [18, 65]
  search_expertise:
    - "novice"
    - "intermediate"
    - "expert"
  ad_sensitivity:
    - "ad_tolerant"
    - "ad_neutral"
    - "ad_averse"
  decision_style:
    - "impulsive"
    - "deliberate"
    - "price_sensitive"
  patience_level:
    - "low"
    - "medium"
    - "high"

environment:
  max_results_per_page: 10
  max_ads_per_page: 3
  ad_positions: [0, 3, 7]
  position_bias:
    # Matched to real 2013 click-position distribution (flatter tail, some rank10 clicks)
    click_prob_by_rank: [0.42, 0.24, 0.13, 0.07, 0.05, 0.02, 0.01, 0.007, 0.003, 0.044]

simulation:
  max_session_steps: 20
  max_queries_per_session: 5
  session_timeout_prob: 0.025      # tuned up: sim over-clicks (+1.59), need more early stops
  num_sessions: 100
  seed: 42
  log_dir: "./logs"
  output_dir: "./output"

intent:
  states:
    - "exploratory"
    - "focused"
    - "transactional"
  initial_distribution: [0.6, 0.3, 0.1]
  transitions:
    click_organic: [0.2, 0.5, 0.3]
    click_ad: [0.1, 0.2, 0.7]
    skip: [0.5, 0.3, 0.2]
    next_page: [0.4, 0.4, 0.2]
    reformulate: [0.5, 0.4, 0.1]
    new_query: [0.7, 0.2, 0.1]
    abandon: [0.0, 0.0, 0.0]
    end_session: [0.0, 0.0, 0.0]

evaluation:
  metrics:
    - "click_position_jsd"
    - "clicks_per_session_gap"
  cfs_weights:
    click_position_jsd: 0.30
    clicks_per_session_gap: 0.70

device: "auto"

calibration:
  # TREC 2013: high-engagement (4.41 clicks/session, abandon only 0.038).
  # Stronger lambda_click (4x clicks vs 2014), weaker KL (LLM prior under-clicks).
  # Larger hidden to capture richer click dynamics.
  calibrator_path: "output/calib/calibrator.pt"
  hidden: 80
  exam_dim: 7
  attr_dim: 7
  lambda_click: 1.2    # tuned down: sim over-clicks by +1.59, reduce click pressure
  lambda_kl: 0.10      # tuned up: need KL to pull back toward prior (less clicking)
  lambda_cal: 0.12     # tuned up: reform -0.34 gap, trust gate needs stronger signal
  lr: 0.003
  epochs: 400
  click_temperature: 4.4    # offline-tuned (sampling MC)
  target_clicks: 4.41    # soft cap = real clicks/session
