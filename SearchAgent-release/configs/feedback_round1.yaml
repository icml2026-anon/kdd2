# SearchAgent Default Configuration

llm:
  model_name: "deepseek-v4-flash"  # API-only; no local model
  temperature: 0.7
  max_new_tokens: 256
  top_p: 0.9

persona:
  age_range: [18, 65]
  search_expertise:
    - "novice"
    - "intermediate"
    - "expert"
  ad_sensitivity:
    - "ad_tolerant"
    - "ad_neutral"
    - "ad_averse"
  decision_style:
    - "impulsive"
    - "deliberate"
    - "price_sensitive"
  patience_level:
    - "low"
    - "medium"
    - "high"

environment:
  max_results_per_page: 10
  max_ads_per_page: 3
  ad_positions: [0, 3, 7]  # positions where ads can appear on SERP
  # Position bias parameters (from real-world studies)
  position_bias:
    click_prob_by_rank: [0.168, 0.170, 0.200, 0.127, 0.098, 0.129, 0.028, 0.055, 0.010, 0.001]

simulation:
  max_session_steps: 20
  max_queries_per_session: 5
  session_timeout_prob: 0.18  # probability of abandoning at each step (calibrated to TREC 2014 ~49%)
  num_sessions: 100
  seed: 42
  log_dir: "./logs"
  output_dir: "./output"

intent:
  # Soft distribution over intent states
  states:
    - "exploratory"
    - "focused"
    - "transactional"
  initial_distribution: [0.6, 0.3, 0.1]
  # Transition tendencies per action type
  transitions:
    click_organic: [0.2, 0.5, 0.3]
    click_ad: [0.1, 0.2, 0.7]
    skip: [0.5, 0.3, 0.2]
    next_page: [0.4, 0.4, 0.2]
    reformulate: [0.5, 0.4, 0.1]
    new_query: [0.7, 0.2, 0.1]
    abandon: [0.0, 0.0, 0.0]
    end_session: [0.0, 0.0, 0.0]

evaluation:
  metrics:
    - "click_position_jsd"
    - "session_length_jsd"
    - "clicks_per_session_gap"
    - "abandon_rate_gap"
    - "reformulation_rate_gap"
  cfs_weights:
    click_position_jsd: 0.25
    session_length_jsd: 0.20
    clicks_per_session_gap: 0.20
    abandon_rate_gap: 0.15
    reformulation_rate_gap: 0.20

device: "auto"

calibration:
  calibrator_path: "output/calib/calibrator.pt"
  hidden: 64
  exam_dim: 7
  attr_dim: 7
  lambda_click: 1.0
  lambda_kl: 0.1
  lambda_cal: 0.05
  lr: 0.003
  epochs: 400
