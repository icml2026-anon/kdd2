# SearchAgent ORCAS Optimized Configuration
# Calibrated for Microsoft ORCAS click logs (avg ~2.65 clicks/session, single-query task structure)

llm:
  model_name: "deepseek-v4-flash"  # API-only; no local model
  temperature: 0.7
  max_new_tokens: 256
  top_p: 0.9

persona:
  age_range: [18, 65]
  search_expertise:
    - "novice"
    - "intermediate"
    - "expert"
  ad_sensitivity:
    - "ad_tolerant"
    - "ad_neutral"
    - "ad_averse"
  decision_style:
    - "impulsive"
    - "deliberate"
    - "price_sensitive"
  patience_level:
    - "low"
    - "medium"
    - "high"

environment:
  max_results_per_page: 10
  max_ads_per_page: 0  # ORCAS doesn't contain commercial search ads
  ad_positions: []
  # Position bias parameters (tuned for Microsoft Bing's rank click curve)
  position_bias:
    click_prob_by_rank: [0.40, 0.22, 0.12, 0.08, 0.06, 0.04, 0.03, 0.02, 0.015, 0.01]

simulation:
  max_session_steps: 3               # ORCAS: single-query, cap at 3 (sim over-clicked 1.97 vs real 1.51)
  max_queries_per_session: 1  # ORCAS are single-query search tasks
  session_timeout_prob: 0.62  # tuned up: pull mean clicks down toward real 1.51
  num_sessions: 100
  seed: 42
  log_dir: "./logs"
  output_dir: "./output"

intent:
  states:
    - "exploratory"
    - "focused"
    - "transactional"
  initial_distribution: [0.7, 0.2, 0.1]
  transitions:
    click_organic: [0.3, 0.5, 0.2]
    click_ad: [0.1, 0.1, 0.8]
    skip: [0.5, 0.3, 0.2]
    next_page: [0.4, 0.4, 0.2]
    reformulate: [0.5, 0.4, 0.1]
    new_query: [0.7, 0.2, 0.1]
    abandon: [0.0, 0.0, 0.0]
    end_session: [0.0, 0.0, 0.0]

evaluation:
  metrics:
    - "click_position_jsd"
    - "clicks_per_session_gap"
  cfs_weights:
    click_position_jsd: 0.30
    clicks_per_session_gap: 0.70

device: "auto"

calibration:
  # ORCAS: single-query sessions (max_queries=1), 1.51 clicks, 0% abandon/reform.
  # Pure click-ranking task. lambda_click dominates — all signal is in which result.
  # Very low KL: ORCAS queries are navigational, LLM prior may be miscalibrated.
  # Small hidden: single-step sessions have less behavioral complexity.
  calibrator_path: "output/calib/calibrator.pt"
  hidden: 48
  exam_dim: 7
  attr_dim: 7
  lambda_click: 3.0    # dominant: single-query means click choice IS the full task
  lambda_kl: 0.05      # low: navigational queries, LLM uncertainty high
  lambda_cal: 0.05
  lr: 0.004            # slightly higher lr: small effective model, fast convergence
  epochs: 300          # fewer epochs: simple single-step dynamics
  click_temperature: 2.0    # offline-tuned (sampling MC)
  target_clicks: 1.51    # soft cap = real clicks/session
